<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Physics Practice | Ibrar Science Hub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            line-height: 1.6;
        }

        header {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .intro p {
            color: #64748b;
        }

        .chapter-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .chapter-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 17px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .chapter-card label {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .chapter-card input {
            margin-top: 5px;
            width: 17px;
            height: 17px;
        }

        .settings {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
        }

        .settings h3 {
            margin-bottom: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .setting label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }

        .start-area {
            text-align: center;
            margin-top: 25px;
        }

        .start-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-btn:hover {
            opacity: 0.9;
        }

        .navigation {
            text-align: center;
            margin: 35px 0 10px;
        }

        .back {
            display: inline-block;
            background: #475569;
            color: white;
            text-decoration: none;
            padding: 10px 17px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 22px;
            margin-top: 40px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 27px;
            }

            .container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Physics Practice</h1>
    <p>Ibrar Science Hub | MDCAT Physics Practice</p>
</header>

<main class="container">

    <div class="intro">
        <h2>Select Physics Units</h2>
        <p>Select one or multiple units for your Physics practice.</p>
    </div>

    <div class="chapter-list">

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Vectors and Equilibrium">
                1. Vectors and Equilibrium
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Force and Motion">
                2. Force and Motion
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Work and Energy">
                3. Work and Energy
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Rotational and Circular Motion">
                4. Rotational and Circular Motion
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Fluid Dynamics">
                5. Fluid Dynamics
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Waves">
                6. Waves
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Thermodynamics">
                7. Thermodynamics
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Electrostatics">
                8. Electrostatics
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Current Electricity">
                9. Current Electricity
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Electromagnetism">
                10. Electromagnetism
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Electromagnetic Induction">
                11. Electromagnetic Induction
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Alternating Current">
                12. Alternating Current
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Electronics">
                13. Electronics
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Dawn of Modern Physics">
                14. Dawn of Modern Physics
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Atomic Spectra">
                15. Atomic Spectra
            </label>
        </div>

        <div class="chapter-card">
            <label>
                <input type="checkbox" name="chapters" value="Nuclear Physics">
                16. Nuclear Physics
            </label>
        </div>

    </div>

    <div class="settings">

        <h3>Test Settings</h3>

        <div class="settings-grid">

            <div class="setting">
                <label for="mcqNumber">Number of MCQs</label>

                <select id="mcqNumber">
                    <option value="10">10 MCQs</option>
                    <option value="20">20 MCQs</option>
                    <option value="30">30 MCQs</option>
                    <option value="40">40 MCQs</option>
                    <option value="50">50 MCQs</option>
                    <option value="60">60 MCQs</option>
                    <option value="80">80 MCQs</option>
                    <option value="81">81 MCQs</option>
                </select>
            </div>

            <div class="setting">
                <label for="difficulty">Difficulty</label>

                <select id="difficulty">
                    <option value="Mixed">Mixed</option>
                    <option value="Easy">Easy</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Difficult">Difficult</option>
                </select>
            </div>

        </div>

        <div class="start-area">
            <button type="button" class="start-btn">
                ▶ Start Test
            </button>
        </div>

    </div>

    <div class="navigation">
        <a href="subject-practice.html" class="back">
            ← Back to Subject Practice
        </a>
    </div>

</main>

<footer>
    <p>© 2026 Ibrar Science Hub. Free Educational Resources.</p>
</footer>

</body>
</html>
