<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCQs Practice Zone | Ibrar Science Hub</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
  line-height: 1.6;
}

header {
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 35px 20px;
}

header h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

header p {
  color: #cbd5e1;
}

.container {
  max-width: 1100px;
  margin: 35px auto;
  padding: 0 20px;
}

.intro {
  text-align: center;
  margin-bottom: 30px;
}

.intro h2 {
  font-size: 26px;
  margin-bottom: 8px;
}

.intro p,
.card p,
.streak p {
  color: #64748b;
}

.section-title {
  margin: 30px 0 15px;
  font-size: 22px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 22px;
  box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
  border: 1px solid #e2e8f0;
}

.card h3 {
  margin-bottom: 8px;
  font-size: 19px;
}

.card p {
  font-size: 14px;
  margin-bottom: 16px;
}

.btn {
  display: inline-block;
  text-decoration: none;
  background: #2563eb;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
}

.coming {
  background: #e2e8f0;
  color: #475569;
}

.streak {
  background: white;
  border-radius: 14px;
  padding: 25px;
  margin-top: 30px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
}

.streak h3 {
  margin-bottom: 8px;
}

.days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.day {
  text-align: center;
  background: #f1f5f9;
  border-radius: 8px;
  padding: 10px 4px;
  font-size: 13px;
}

.day span {
  display: block;
  font-weight: bold;
  margin-bottom: 4px;
}

.navigation {
  text-align: center;
  margin: 35px 0 10px;
}

.back {
  background: #475569;
}

footer {
  text-align: center;
  background: #0f172a;
  color: #cbd5e1;
  padding: 22px;
  margin-top: 40px;
  font-size: 14px;
}

@media (max-width: 600px) {

  header h1 {
    font-size: 26px;
  }

  .days {
    gap: 5px;
  }

  .day {
    padding: 8px 2px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MCQs Practice Zone</h1>
  <p>Ibrar Science Hub | Practice, Test &amp; Improve</p>
</header>

<main class="container">

  <div class="intro">
    <h2>Choose Your Practice</h2>
    <p>Select the type of practice you want to start.</p>
  </div>

  <h2 class="section-title">Practice Modes</h2>

  <div class="grid">
<div class="card">
  <h3>📚 Subject Practice</h3>
  <p>Practice MCQs from a complete subject.</p>
  <a href="subject-practice.html" class="btn">Open Subject Practice</a>
</div>
